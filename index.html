<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão Logística</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <div id="auth-screen" class="flex items-center justify-center min-h-screen bg-gray-900">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <h2 class="text-2xl font-bold text-center mb-6 text-gray-800" id="auth-title">Acesso ao Sistema</h2>
            
            <form id="auth-form" class="space-y-4">
                <div id="name-field" class="hidden">
                    <label class="block text-sm font-medium text-gray-700">Nome Completo</label>
                    <input type="text" id="user-name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="Digite seu nome">
                </div>
                
                <div id="role-field" class="hidden">
                    <label class="block text-sm font-medium text-gray-700">Cargo</label>
                    <select id="user-role" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                        <option value="conferente">Conferente</option>
                        <option value="inspetor_qualidade">Inspetor de Qualidade</option>
                        <option value="assistente_operacional">Assistente Operacional</option>
                        <option value="administrador">Administrador</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">E-mail</label>
                    <input type="email" id="email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="seu@email.com">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Senha</label>
                    <input type="password" id="password" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="******">
                </div>
                
                <button type="submit" id="auth-btn" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700">Entrar</button>
            </form>
            
            <p class="mt-4 text-sm text-center">
                <a href="#" id="toggle-auth" class="text-blue-600 hover:underline">Precisa criar uma conta? Cadastre-se</a>
            </p>
        </div>
    </div>

    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <nav class="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <h1 class="text-xl font-bold">Logística Web</h1>
                <span class="text-xs bg-blue-700 py-1 px-2 rounded">Unidade: Praia Grande</span>
            </div>
            <div class="flex items-center space-x-4">
                <span id="user-info" class="text-sm">Usuário Logado</span>
                <button onclick="fazerLogout()" class="bg-red-500 hover:bg-red-600 text-white text-sm font-bold py-1 px-3 rounded">Sair</button>
            </div>
        </nav>

        <div class="bg-white shadow-sm flex space-x-4 p-4">
            <button onclick="mostrarAba('estoque')" class="text-blue-600 font-semibold hover:underline">Estoque</button>
            <button onclick="mostrarAba('romaneios')" class="text-blue-600 font-semibold hover:underline">Romaneios e Frota</button>
        </div>

        <main class="flex-grow p-6">
            
            <div id="aba-estoque" class="aba-conteudo">
                <h2 class="text-2xl font-bold mb-4">Controle de Estoque</h2>
                <div class="bg-white p-4 rounded shadow">
                    <button onclick="carregarEstoque()" class="mb-4 bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">Atualizar Lista</button>
                    <table class="min-w-full table-auto">
                        <thead class="bg-gray-200">
                            <tr>
                                <th class="px-4 py-2 text-left">SKU</th>
                                <th class="px-4 py-2 text-left">Descrição</th>
                                <th class="px-4 py-2 text-left">Quantidade</th>
                                <th class="px-4 py-2 text-left">Setor</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-estoque">
                            <tr><td colspan="4" class="text-center py-4 text-gray-500">Clique em "Atualizar Lista" para carregar.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="aba-romaneios" class="aba-conteudo hidden">
                <h2 class="text-2xl font-bold mb-4">Gestão de Romaneios</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-4 rounded shadow col-span-1">
                        <h3 class="text-lg font-bold mb-3">Novo Registro</h3>
                        <form id="form-romaneio" class="space-y-3">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Nº Documento</label>
                                <input type="text" id="num-doc" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Placa do Veículo / Caminhão</label>
                                <input type="text" id="placa-veiculo" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 uppercase" placeholder="Ex: QIM3F07" maxlength="7">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Tipo</label>
                                <select id="tipo-romaneio" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                                    <option value="ENTRADA">Entrada</option>
                                    <option value="SAIDA">Saída</option>
                                </select>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700">Criar Romaneio</button>
                        </form>
                    </div>
                    
                    <div class="bg-white p-4 rounded shadow col-span-2">
                         <h3 class="text-lg font-bold mb-3">Romaneios Ativos</h3>
                         <ul id="lista-romaneios" class="space-y-2">
                             <li class="text-gray-500 italic">Nenhum romaneio carregado.</li>
                         </ul>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://asrjgralrkxhulyoqzdh.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ZQHPjHaFlqFck_IM3Ayukw_8qMcgkwA';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isLogin = true;
        
        document.getElementById('toggle-auth').addEventListener('click', (e) => {
            e.preventDefault();
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? 'Acesso ao Sistema' : 'Cadastro de Colaborador';
            document.getElementById('auth-btn').innerText = isLogin ? 'Entrar' : 'Cadastrar';
            document.getElementById('toggle-auth').innerText = isLogin ? 'Precisa criar uma conta? Cadastre-se' : 'Já tem conta? Faça login';
            
            document.getElementById('name-field').classList.toggle('hidden');
            document.getElementById('role-field').classList.toggle('hidden');
        });

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isLogin) {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) alert('Erro no login: ' + error.message);
                else verificarSessao();
            } else {
                const nome = document.getElementById('user-name').value;
                const cargo = document.getElementById('user-role').value;
                
                const { data, error } = await supabase.auth.signUp({ 
                    email, 
                    password 
                });

                if (error) {
                    alert('Erro no cadastro: ' + error.message);
                    return;
                }

                if (data.user) {
                    await supabase.from('perfis').insert([
                        { id: data.user.id, nome: nome, cargo: cargo }
                    ]);
                    alert('Cadastro realizado! Por favor, faça login.');
                    document.getElementById('toggle-auth').click();
                }
            }
        });

        async function verificarSessao() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('user-info').innerText = session.user.email;
                carregarEstoque();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        }

        async function fazerLogout() {
            await supabase.auth.signOut();
            verificarSessao();
        }

        function mostrarAba(abaId) {
            document.querySelectorAll('.aba-conteudo').forEach(el => el.classList.add('hidden'));
            document.getElementById('aba-' + abaId).classList.remove('hidden');
        }

        async function carregarEstoque() {
            const tbody = document.getElementById('tabela-estoque');
            tbody.innerHTML = '<tr><td colspan="4" class="text-center">Carregando...</td></tr>';
            
            const { data: estoque, error } = await supabase.from('estoque').select('*');
            
            if (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-red-500">Erro ao carregar dados.</td></tr>';
                return;
            }

            if (estoque.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center">Estoque vazio.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            estoque.forEach(item => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="px-4 py-2 font-mono text-sm">${item.codigo_sku}</td>
                        <td class="px-4 py-2">${item.descricao}</td>
                        <td class="px-4 py-2 font-bold">${item.quantidade}</td>
                        <td class="px-4 py-2">${item.setor || '-'}</td>
                    </tr>
                `;
            });
        }

        document.getElementById('form-romaneio').addEventListener('submit', async (e) => {
            e.preventDefault();
            const numDoc = document.getElementById('num-doc').value;
            const tipo = document.getElementById('tipo-romaneio').value;
            const placa = document.getElementById('placa-veiculo').value; 

            const { data: { user } } = await supabase.auth.getUser();

            const { data, error } = await supabase
                .from('romaneios')
                .insert([{ 
                    numero_documento: numDoc, 
                    tipo: tipo,
                    responsavel_id: user.id
                }]);

            if (error) {
                alert('Erro ao criar romaneio: ' + error.message);
            } else {
                alert('Romaneio salvo com sucesso!');
                document.getElementById('form-romaneio').reset();
            }
        });

        verificarSessao();
    </script>
</body>
</html>
